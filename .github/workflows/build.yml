name: Build Anogs Bypass

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build Dobby
        run: |
          git clone https://github.com/jmpews/Dobby.git dobby-src
          cd dobby-src
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release -DENABLE_CLOSURE=OFF -DCMAKE_ASM_COMPILER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
          make -j4
          echo "DOBBY_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build Bypass
        run: |
          export DOBBY_DIR=${{ env.DOBBY_DIR }}
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: anogs_bypass-so
          path: libs/arm64-v8a/libanogs_bypass.so
